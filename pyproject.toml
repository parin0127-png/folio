[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-ai"
version = "0.1.1"
description = "A powerful AI agent framework with 40+ MCP tools, RAG pipeline, and multi-model support."
readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "Parin Prajapati" }
]

requires-python = ">=3.11"

keywords = [
    "ai",
    "agent",
    "mcp",
    "rag",
    "llm",
    "groq",
    "mistral",
    "framework"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "groq",
    "mistralai",
    "mcp==1.9.4",
    "sentence-transformers",
    "torch==2.13.0+cpu",
    "numpy",
    "pandas",
    "openpyxl",
    "spacy",
    "rapidfuzz",
    "lxml[html_clean]",
    "wikipedia-api",
    "python-jobspy",
    "requests",
    "python-dotenv",
    "reportlab",
    "slack_sdk",
]

[project.urls]
Homepage = "https://github.com/parin0127-png/folio"
Repository = "https://github.com/parin0127-png/folio"

[project.scripts]
folio = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["folio*", "task*"]